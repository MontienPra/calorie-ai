<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บันทึกแคลอรี่ AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body class="bg-slate-100 min-h-screen p-4">
  <div class="max-w-md mx-auto bg-white rounded-2xl shadow p-5 mt-4">
    <h1 class="text-xl font-bold text-slate-800 mb-3 text-center">🥗 คำนวณแคลอรี่อาหาร AI</h1>

    <div class="mb-4">
      <label class="block text-xs font-medium text-gray-500 mb-1">Gemini API Key ของคุณ</label>
      <input type="password" id="apiKeyInput" placeholder="วาง API Key ที่นี่ (กรอกครั้งเดียว)" 
             class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 text-center mb-4">
      <div class="text-xs text-blue-600 font-semibold">แคลอรี่รวมวันนี้</div>
      <div class="text-3xl font-extrabold text-blue-900 my-1"><span id="totalCal">0</span> <span class="text-sm font-normal">kcal</span></div>
      <button onclick="clearToday()" class="text-xs text-red-500 hover:underline">ล้างรายการของวันนี้</button>
    </div>

    <div class="mb-3">
      <label class="block text-xs font-medium text-gray-500 mb-1">มื้ออาหาร</label>
      <select id="mealType" class="w-full border rounded-lg p-2 text-sm mb-2 bg-white">
        <option>มื้อเช้า</option>
        <option>มื้อเที่ยง</option>
        <option>มื้อเย็น</option>
        <option>ของว่าง</option>
      </select>
      <input type="text" id="foodText" placeholder="เช่น ข้าวโอ๊ต 400 กรัม ไข่ต้ม 2 ฟอง" 
             class="w-full border rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <button id="calcBtn" onclick="calculateCal()" 
            class="w-full bg-blue-600 text-white font-medium py-2.5 rounded-lg text-sm hover:bg-blue-700 transition">
      คำนวณและบันทึก
    </button>

    <div class="mt-6">
      <h2 class="text-sm font-semibold text-gray-700 mb-2">มื้ออาหารที่บันทึกวันนี้</h2>
      <div id="mealList" class="space-y-2">
        <p class="text-xs text-gray-400 text-center py-4">ยังไม่มีรายการอาหาร</p>
      </div>
    </div>
  </div>

  <script>
    // ดึงวันที่ปัจจุบันมาเป็น Key เพื่อแยกวันอัตโนมัติ
    const today = new Date().toISOString().slice(0, 10);
    const STORAGE_KEY = 'meal_data_' + today;
    let meals = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    // ดึง API Key ที่เคยบันทึกไว้ในเครื่อง
    document.getElementById('apiKeyInput').value = localStorage.getItem('my_gemini_key') || '';
    render();

    async function calculateCal() {
      const apiKey = document.getElementById('apiKeyInput').value.trim();
      const food = document.getElementById('foodText').value.trim();
      const mealType = document.getElementById('mealType').value;
      const btn = document.getElementById('calcBtn');

      if (!apiKey) return alert('กรุณาใส่ API Key ก่อนนะครับ');
      if (!food) return alert('กรุณาพิมพ์รายการอาหารที่กินครับ');

      // จำ Key ไว้ในเครื่อง
      localStorage.setItem('my_gemini_key', apiKey);
      btn.disabled = true;
      btn.innerText = 'กำลังคำนวณ... กรุณารอสักครู่';

      const prompt = `ประเมินแคลอรี่ของ: "${food}" ตอบกลับมาเฉพาะรูปแบบ JSON เท่านั้น ตัวอย่าง: {"calories": 520, "summary": "รายละเอียดสั้นๆ"}`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { responseMimeType: "application/json" }
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const result = JSON.parse(data.candidates[0].content.parts[0].text);

        // เพิ่มรายการเข้าบันทึก
        meals.push({
          time: mealType,
          food: food,
          cal: result.calories || 0,
          desc: result.summary || ''
        });

        localStorage.setItem(STORAGE_KEY, JSON.stringify(meals));
        document.getElementById('foodText').value = '';
        render();
      } catch (err) {
        alert('เกิดข้อผิดพลาด: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'คำนวณและบันทึก';
      }
    }

    function render() {
      const listEl = document.getElementById('mealList');
      const totalEl = document.getElementById('totalCal');
      
      if (meals.length === 0) {
        listEl.innerHTML = '<p class="text-xs text-gray-400 text-center py-4">ยังไม่มีรายการอาหาร</p>';
        totalEl.innerText = 0;
        return;
      }

      let sum = 0;
      listEl.innerHTML = meals.map(m => {
        sum += m.cal;
        return `
          <div class="p-3 bg-slate-50 border rounded-lg flex justify-between items-center">
            <div>
              <span class="text-[10px] bg-blue-100 text-blue-700 font-semibold px-2 py-0.5 rounded">${m.time}</span>
              <div class="text-sm font-medium text-slate-800 mt-1">${m.food}</div>
              ${m.desc ? `<div class="text-[11px] text-gray-500">${m.desc}</div>` : ''}
            </div>
            <div class="text-base font-bold text-slate-900">${m.cal} <span class="text-xs font-normal">kcal</span></div>
          </div>
        `;
      }).reverse().join('');

      totalEl.innerText = sum.toLocaleString();
    }

    function clearToday() {
      if (confirm('ต้องการล้างข้อมูลของวันนี้ทั้งหมดใช่ไหม?')) {
        meals = [];
        localStorage.removeItem(STORAGE_KEY);
        render();
      }
    }
  </script>
</body>
</html>
